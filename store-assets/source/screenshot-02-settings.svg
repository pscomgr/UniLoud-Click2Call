<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="header2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b4f51"/>
      <stop offset="1" stop-color="#157b7d"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#173d3f" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="#e9f1f0"/>
  <rect x="30" y="34" width="714" height="732" rx="18" fill="#fff" stroke="#cedbd9"/>
  <rect x="30" y="34" width="714" height="66" rx="18" fill="#0f3f42"/>
  <rect x="30" y="82" width="714" height="18" fill="#0f3f42"/>
  <text x="66" y="76" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">Private PBX · direct connection</text>
  <text x="66" y="151" fill="#183033" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700">Designed for customer-controlled telephony</text>
  <text x="66" y="187" fill="#587072" font-family="DejaVu Sans, sans-serif" font-size="16">Chrome sends an authenticated HTTPS request only to the configured PBX.</text>

  <rect x="66" y="232" width="642" height="92" rx="12" fill="#f4f8f7" stroke="#d5e3e1"/>
  <circle cx="112" cy="278" r="25" fill="#dcefed"/>
  <text x="112" y="286" fill="#116466" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25">1</text>
  <text x="154" y="268" fill="#183033" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">Personal API credentials</text>
  <text x="154" y="293" fill="#587072" font-family="DejaVu Sans, sans-serif" font-size="14">One allow-listed extension per user or managed browser.</text>

  <rect x="66" y="344" width="642" height="92" rx="12" fill="#f4f8f7" stroke="#d5e3e1"/>
  <circle cx="112" cy="390" r="25" fill="#dcefed"/>
  <text x="112" y="398" fill="#116466" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25">2</text>
  <text x="154" y="380" fill="#183033" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">PJSIP or SIP / chan_sip</text>
  <text x="154" y="405" fill="#587072" font-family="DejaVu Sans, sans-serif" font-size="14">PJSIP can ring all registered devices for the user.</text>

  <rect x="66" y="456" width="642" height="92" rx="12" fill="#f4f8f7" stroke="#d5e3e1"/>
  <circle cx="112" cy="502" r="25" fill="#dcefed"/>
  <text x="112" y="510" fill="#116466" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="25">3</text>
  <text x="154" y="492" fill="#183033" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">No cloud relay</text>
  <text x="154" y="517" fill="#587072" font-family="DejaVu Sans, sans-serif" font-size="14">Call details remain between Chrome and the organization’s PBX.</text>

  <rect x="66" y="594" width="642" height="116" rx="12" fill="#0b4f51"/>
  <text x="94" y="630" fill="#cde9e8" font-family="DejaVu Sans, sans-serif" font-size="13">SUPPORTED BACKEND</text>
  <text x="94" y="666" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700">Self-hosted PHP 8.x + Asterisk AMI</text>
  <text x="94" y="693" fill="#cde9e8" font-family="DejaVu Sans, sans-serif" font-size="14">HTTPS · rate limiting · explicit destination policy</text>

  <g filter="url(#shadow2)">
    <rect x="796" y="34" width="438" height="732" rx="14" fill="#f4f8f7"/>
    <path d="M810 34h410a14 14 0 0 1 14 14v72H796V48a14 14 0 0 1 14-14z" fill="url(#header2)"/>
    <circle cx="838" cy="77" r="20" fill="#fff"/>
    <path d="M828 65c6 13 14 21 27 26l6-7-8-6-5 4c-5-3-9-7-12-13l4-4-6-8z" fill="#116466"/>
    <text x="870" y="74" fill="#fff" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700">UniLoud Click-to-Call</text>
    <text x="870" y="96" fill="#cde9e8" font-family="DejaVu Sans, sans-serif" font-size="12">Version 1.4.0</text>

    <rect x="814" y="138" width="402" height="594" rx="10" fill="#fff" stroke="#cde0dd"/>
    <text x="834" y="170" fill="#183033" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700">⌄  Connection settings</text>
    <line x1="814" y1="187" x2="1216" y2="187" stroke="#e1ecea"/>

    <text x="834" y="217" fill="#183033" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700">PBX HTTPS URL</text>
    <rect x="834" y="228" width="362" height="38" rx="7" fill="#fff" stroke="#a9c4c1"/>
    <text x="846" y="252" fill="#183033" font-family="DejaVu Sans, sans-serif" font-size="12">https://pbx.example.com/uniloud-click2call</text>

    <text x="834" y="291" fill="#183033" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700">API ID</text>
    <rect x="834" y="302" width="362" height="38" rx="7" fill="#fff" stroke="#a9c4c1"/>
    <text x="846" y="326" fill="#183033" font-family="DejaVu Sans, sans-serif" font-size="12">browser-user205</text>

    <text x="834" y="365" fill="#183033" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700">API secret</text>
    <rect x="834" y="376" width="362" height="38" rx="7" fill="#fff" stroke="#a9c4c1"/>
    <text x="846" y="400" fill="#587072" font-family="DejaVu Sans, sans-serif" font-size="14">••••••••••••••••••••••••••••</text>

    <rect x="835" y="434" width="15" height="15" rx="3" fill="#fff" stroke="#8aa9a6"/>
    <text x="862" y="447" fill="#183033" font-family="DejaVu Sans, sans-serif" font-size="11">Remember the API secret on this device</text>

    <text x="834" y="480" fill="#183033" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700">PBX protocol</text>
    <rect x="834" y="491" width="174" height="38" rx="7" fill="#fff" stroke="#a9c4c1"/>
    <text x="846" y="515" fill="#183033" font-family="DejaVu Sans, sans-serif" font-size="12">PJSIP</text>
    <path d="M988 505l6 7 6-7" fill="none" stroke="#587072"/>
    <rect x="1018" y="491" width="178" height="38" rx="7" fill="#dcefed"/>
    <text x="1107" y="515" fill="#0b4f51" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="11" font-weight="700">Connect and load</text>

    <text x="834" y="558" fill="#183033" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700">My extension</text>
    <rect x="834" y="569" width="362" height="38" rx="7" fill="#fff" stroke="#a9c4c1"/>
    <text x="846" y="593" fill="#183033" font-family="DejaVu Sans, sans-serif" font-size="12">205 — User 205</text>
    <path d="M1176 583l6 7 6-7" fill="none" stroke="#587072"/>

    <rect x="835" y="630" width="15" height="15" rx="3" fill="#fff" stroke="#8aa9a6"/>
    <text x="862" y="643" fill="#183033" font-family="DejaVu Sans, sans-serif" font-size="11">Send a sanitized page URL with calls</text>
    <rect x="834" y="669" width="84" height="40" rx="7" fill="#116466"/>
    <text x="876" y="694" fill="#fff" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700">Save</text>
    <rect x="928" y="669" width="84" height="40" rx="7" fill="#fae2e2"/>
    <text x="970" y="694" fill="#8b1d1d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700">Clear</text>
  </g>
</svg>
